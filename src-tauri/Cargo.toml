[package]
name = "documentbench"
version = "0.1.0"
description = "An independent desktop PDF productivity workspace"
edition = "2021"
rust-version = "1.85"

[lib]
name = "documentbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
thiserror = "2"
lopdf = "0.36"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.38", features = ["serialize"] }
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_SystemServices", "Win32_Storage_Xps", "Win32_Security"] }

[profile.dev]
incremental = true

[profile.release]
lto = true
codegen-units = 1
strip = true
